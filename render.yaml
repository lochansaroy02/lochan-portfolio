# Render Blueprint — deploys the FastAPI chatbot service.
# In Render: New > Blueprint, point it at this repo, then set GROQ_API_KEY
# when prompted (sync: false means it is never stored in this file).
services:
  - name: portfolio-api
    type: web
    runtime: python
    plan: free
    rootDir: ./api
    buildCommand: pip install uv && uv sync --frozen
    # Render injects $PORT. Binding 0.0.0.0 is required or the health check fails.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.13"
      - key: GROQ_API_KEY
        sync: false
